<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Checkitz — Luxury PG Audit & Reality Intelligence</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
:root {
  --bg: #0b0f17;
  --surface: #121824;
  --surface-card: #182030;
  --surface-elevated: #222d42;
  --border: rgba(255, 255, 255, 0.08);
  --border-strong: rgba(255, 255, 255, 0.16);
  --gold: #d4a373;
  --gold-glow: rgba(212, 163, 115, 0.2);
  --text-primary: #f0f3f8;
  --text-secondary: #94a3b8;
  --text-muted: #64748b;
  --ok: #2ecc71;
  --ok-bg: rgba(46, 204, 113, 0.12);
  --warn: #e0a040;
  --warn-bg: rgba(224, 160, 64, 0.12);
  --red: #ff5252;
  --red-bg: rgba(255, 82, 82, 0.12);
  --radius-lg: 20px;
  --radius-md: 14px;
  --radius-sm: 8px;
  --shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.6);
  --glass: rgba(18, 24, 36, 0.75);
}

[data-theme="light"] {
  --bg: #f8fafc;
  --surface: #ffffff;
  --surface-card: #f1f5f9;
  --surface-elevated: #e2e8f0;
  --border: rgba(0, 0, 0, 0.08);
  --border-strong: rgba(0, 0, 0, 0.16);
  --gold: #b27a3c;
  --gold-glow: rgba(178, 122, 60, 0.15);
  --text-primary: #0f172a;
  --text-secondary: #475569;
  --text-muted: #64748b;
  --glass: rgba(255, 255, 255, 0.85);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

body {
  background: var(--bg);
  color: var(--text-primary);
  font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
  line-height: 1.5;
  min-height: 100vh;
  padding-bottom: 90px;
  overflow-x: hidden;
}

/* Typography */
h1, h2, h3, .serif {
  font-family: 'Playfair Display', Georgia, serif;
  font-weight: 600;
  letter-spacing: -0.02em;
}
.italic { font-style: italic; }

/* Sticky Header */
header {
  position: sticky;
  top: 0;
  z-index: 40;
  background: var(--glass);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border);
  padding: 14px 20px;
}
.header-inner {
  max-width: 680px;
  margin: auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  text-decoration: none;
  color: var(--text-primary);
}
.brand-mark {
  width: 32px;
  height: 32px;
  border-radius: 9px;
  background: linear-gradient(135deg, var(--gold), #8a5a2a);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-weight: 700;
  font-size: 16px;
  box-shadow: 0 4px 12px var(--gold-glow);
}
.brand-name {
  font-family: 'Playfair Display', serif;
  font-size: 20px;
  letter-spacing: -0.01em;
}
.brand-name span { color: var(--gold); }

.header-actions {
  display: flex;
  align-items: center;
  gap: 10px;
}
.icon-btn {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text-secondary);
  width: 36px;
  height: 36px;
  border-radius: 10px;
  display: grid;
  place-items: center;
  cursor: pointer;
  transition: all 0.2s;
}
.icon-btn:hover {
  background: var(--surface-card);
  color: var(--text-primary);
  border-color: var(--border-strong);
}

/* Main Container */
main {
  max-width: 680px;
  margin: auto;
  padding: 20px 16px;
}

/* Hero Section */
.hero {
  padding: 24px 0 16px;
  text-align: left;
}
.hero-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--gold);
  padding: 4px 12px;
  border-radius: 99px;
  background: var(--gold-glow);
  border: 1px solid rgba(212, 163, 115, 0.3);
  margin-bottom: 12px;
  font-weight: 600;
}
.hero-title {
  font-size: 32px;
  line-height: 1.15;
  margin-bottom: 8px;
}
.hero-sub {
  color: var(--text-secondary);
  font-size: 14px;
}

/* Cards & Editorial Modules */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 20px;
  margin-bottom: 16px;
  box-shadow: var(--shadow);
  position: relative;
  overflow: hidden;
  transition: transform 0.2s, border-color 0.2s;
}
.card-hover:hover {
  border-color: var(--border-strong);
  transform: translateY(-2px);
}

/* PG Listing Card */
.pg-item {
  display: flex;
  flex-direction: column;
  padding: 0;
  cursor: pointer;
}
.pg-img-wrap {
  position: relative;
  height: 180px;
  width: 100%;
  overflow: hidden;
  background: var(--surface-card);
}
.pg-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.4s ease;
}
.pg-item:hover .pg-img {
  transform: scale(1.04);
}
.pg-scrim {
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgba(11, 15, 23, 0.1) 0%, rgba(11, 15, 23, 0.85) 100%);
}
.pg-badge-floating {
  position: absolute;
  top: 14px;
  right: 14px;
  background: rgba(11, 15, 23, 0.85);
  backdrop-filter: blur(8px);
  color: var(--gold);
  border: 1px solid rgba(212, 163, 115, 0.4);
  font-size: 12px;
  font-weight: 600;
  padding: 4px 10px;
  border-radius: 99px;
}
.pg-info-floating {
  position: absolute;
  bottom: 14px;
  left: 16px;
  right: 16px;
}
.pg-info-floating h3 {
  font-size: 21px;
  color: #fff;
  margin-bottom: 2px;
}
.pg-info-floating .loc {
  font-size: 13px;
  color: rgba(255, 255, 255, 0.75);
}
.pg-body {
  padding: 16px 18px 20px;
}
.pg-meta-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin: 12px 0 16px;
}
.pg-meta-box {
  background: var(--surface-card);
  padding: 8px 12px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
}
.pg-meta-box small {
  font-size: 11px;
  color: var(--text-muted);
  display: block;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.pg-meta-box b {
  font-size: 14px;
  color: var(--text-primary);
}

/* Custom PG Action Button */
.btn-custom-pg {
  background: linear-gradient(135deg, rgba(212, 163, 115, 0.15), rgba(212, 163, 115, 0.05));
  border: 1px dashed var(--gold);
  color: var(--gold);
  width: 100%;
  padding: 16px;
  border-radius: var(--radius-lg);
  font-family: inherit;
  font-weight: 600;
  font-size: 15px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin-bottom: 20px;
  transition: all 0.2s;
}
.btn-custom-pg:hover {
  background: var(--gold-glow);
  transform: translateY(-1px);
}

/* Buttons */
.btn {
  background: linear-gradient(135deg, var(--gold), #9b6c38);
  color: #fff;
  border: none;
  padding: 14px 22px;
  border-radius: var(--radius-md);
  font-family: inherit;
  font-weight: 600;
  font-size: 15px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  box-shadow: 0 4px 14px var(--gold-glow);
  transition: all 0.2s;
  width: 100%;
}
.btn:hover {
  filter: brightness(1.1);
  transform: translateY(-1px);
}
.btn:active { transform: translateY(0); }
.btn.sec {
  background: transparent;
  color: var(--text-primary);
  border: 1px solid var(--border-strong);
  box-shadow: none;
}
.btn.sec:hover {
  background: var(--surface-card);
}
.btn.whatsapp {
  background: #25d366;
  color: #fff;
  box-shadow: 0 4px 14px rgba(37, 211, 102, 0.3);
}
.btn.whatsapp:hover { filter: brightness(1.08); }

/* Sticky Bottom Navigation Bar */
.tab-bar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--glass);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-top: 1px solid var(--border);
  display: flex;
  justify-content: center;
  padding: 8px 12px calc(8px + env(safe-area-inset-bottom, 0px));
  z-index: 50;
}
.tab-bar-inner {
  max-width: 680px;
  width: 100%;
  display: flex;
  justify-content: space-around;
  gap: 4px;
}
.tab-btn {
  background: transparent;
  border: none;
  color: var(--text-muted);
  font-family: inherit;
  font-size: 11px;
  font-weight: 600;
  padding: 6px 12px;
  border-radius: var(--radius-sm);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  cursor: pointer;
  flex: 1;
  transition: color 0.2s;
}
.tab-btn span.num {
  font-size: 10px;
  background: var(--surface-card);
  padding: 2px 6px;
  border-radius: 99px;
  border: 1px solid var(--border);
}
.tab-btn.active {
  color: var(--gold);
}
.tab-btn.active span.num {
  background: var(--gold);
  color: #fff;
  border-color: transparent;
}

/* Audit Top Bar */
.pg-active-bar {
  background: var(--surface-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 12px 16px;
  margin-bottom: 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.pg-active-bar b { font-family: 'Playfair Display', serif; font-size: 17px; }

/* Segmented Buttons */
.seg {
  display: flex;
  gap: 8px;
  margin-top: 12px;
}
.seg button {
  flex: 1;
  padding: 11px 6px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: var(--surface-card);
  color: var(--text-secondary);
  font-family: inherit;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s ease;
}
.seg button:hover { border-color: var(--border-strong); }
.seg button.on.g { background: var(--ok); color: #fff; border-color: transparent; }
.seg button.on.a { background: var(--warn); color: #fff; border-color: transparent; }
.seg button.on.p { background: var(--red); color: #fff; border-color: transparent; }
.seg button.on.n { background: var(--text-muted); color: #fff; border-color: transparent; }

/* Input Fields */
.form-group {
  margin-bottom: 14px;
}
.form-group label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 6px;
  color: var(--text-secondary);
}
.inp-wrap {
  display: flex;
  align-items: center;
  background: var(--surface-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 0 14px;
  transition: border-color 0.2s;
}
.inp-wrap:focus-within {
  border-color: var(--gold);
}
.inp-wrap span.pre {
  color: var(--text-muted);
  font-size: 15px;
  margin-right: 6px;
}
.inp-wrap input {
  background: transparent;
  border: none;
  outline: none;
  color: var(--text-primary);
  font-family: inherit;
  font-size: 15px;
  font-weight: 600;
  padding: 12px 0;
  width: 100%;
}

/* Sharing Pills */
.share-selector {
  display: flex;
  gap: 8px;
  margin: 8px 0 16px;
}
.share-pill {
  flex: 1;
  padding: 10px 4px;
  text-align: center;
  font-size: 13px;
  font-weight: 600;
  background: var(--surface-card);
  border: 1px solid var(--border);
  color: var(--text-secondary);
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all 0.2s;
}
.share-pill.active {
  background: var(--gold-glow);
  color: var(--gold);
  border-color: var(--gold);
}

/* Alerts & Red Flag Banners */
.alert {
  padding: 12px 16px;
  border-radius: var(--radius-md);
  font-size: 13px;
  margin: 12px 0;
  display: flex;
  gap: 10px;
  align-items: flex-start;
  border-left: 4px solid var(--red);
  background: var(--red-bg);
  color: var(--text-primary);
}
.alert.warn {
  border-left-color: var(--warn);
  background: var(--warn-bg);
}
.alert.good {
  border-left-color: var(--ok);
  background: var(--ok-bg);
}
.alert.info {
  border-left-color: var(--gold);
  background: var(--gold-glow);
}

/* Photo Gallery Preview */
.photo-uploader {
  border: 2px dashed var(--border-strong);
  border-radius: var(--radius-md);
  padding: 20px;
  text-align: center;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--surface-card);
}
.photo-uploader:hover {
  border-color: var(--gold);
  background: var(--gold-glow);
}
.photo-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-top: 14px;
}
.photo-thumb {
  position: relative;
  aspect-ratio: 1;
  border-radius: var(--radius-sm);
  overflow: hidden;
  border: 1px solid var(--border);
}
.photo-thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  cursor: pointer;
}
.photo-thumb button.del {
  position: absolute;
  top: 4px;
  right: 4px;
  background: rgba(0, 0, 0, 0.75);
  color: #fff;
  border: none;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  cursor: pointer;
  font-size: 12px;
  display: grid;
  place-items: center;
}

/* Score Ring */
.score-hero {
  text-align: center;
  padding: 24px 16px;
}
.ring-box {
  width: 140px;
  height: 140px;
  border-radius: 50%;
  margin: 0 auto 16px;
  display: grid;
  place-items: center;
  background: conic-gradient(var(--ring-color) calc(var(--ring-pct) * 1%), var(--border) 0);
  box-shadow: 0 0 30px var(--ring-glow);
}
.ring-inner {
  width: 110px;
  height: 110px;
  border-radius: 50%;
  background: var(--surface);
  display: grid;
  place-items: center;
  text-align: center;
}
.ring-inner b {
  font-size: 38px;
  font-family: 'Playfair Display', serif;
  line-height: 1;
  color: var(--text-primary);
}
.ring-inner span {
  font-size: 11px;
  color: var(--text-muted);
  text-transform: uppercase;
}

/* Horizontal Bar Chart for Score Breakdown */
.chart-bar-wrap {
  margin: 16px 0;
}
.chart-bar {
  height: 14px;
  border-radius: 99px;
  background: var(--surface-elevated);
  display: flex;
  overflow: hidden;
}
.chart-seg {
  height: 100%;
  transition: width 0.4s ease;
}
.chart-seg.g { background: var(--ok); }
.chart-seg.a { background: var(--warn); }
.chart-seg.p { background: var(--red); }
.chart-legend {
  display: flex;
  justify-content: space-between;
  margin-top: 8px;
  font-size: 12px;
}
.chart-legend span {
  display: flex;
  align-items: center;
  gap: 5px;
}
.dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  display: inline-block;
}

/* Modal */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.75);
  backdrop-filter: blur(8px);
  z-index: 100;
  display: none;
  place-items: center;
  padding: 16px;
}
.modal-overlay.open { display: grid; }
.modal-box {
  background: var(--surface);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-lg);
  max-width: 520px;
  width: 100%;
  max-height: 90vh;
  overflow-y: auto;
  padding: 24px;
  box-shadow: 0 20px 40px rgba(0,0,0,0.8);
}
.modal-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 18px;
}
.modal-close {
  background: transparent;
  border: none;
  color: var(--text-secondary);
  font-size: 20px;
  cursor: pointer;
}

/* Comparison Table */
.cmp-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
  margin: 14px 0;
}
.cmp-table th, .cmp-table td {
  padding: 10px 8px;
  text-align: left;
  border-bottom: 1px solid var(--border);
}
.cmp-table th {
  color: var(--text-muted);
  font-weight: 600;
}
.cmp-table tr:hover { background: var(--surface-card); }

/* Quick Mode Toggle Badge */
.mode-toggle {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--surface-card);
  border: 1px solid var(--border);
  padding: 8px 14px;
  border-radius: var(--radius-md);
  margin-bottom: 16px;
}

.row-actions {
  display: flex;
  gap: 10px;
  margin-top: 16px;
}
.row-actions > * { flex: 1; }

/* Toast */
#toast {
  position: fixed;
  bottom: 85px;
  left: 50%;
  transform: translateX(-50%);
  background: #111827;
  color: #fff;
  border: 1px solid var(--gold);
  padding: 10px 20px;
  border-radius: 99px;
  font-size: 13px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.5);
  z-index: 120;
  display: none;
  animation: fadeIn 0.2s ease;
}
@keyframes fadeIn { from { opacity: 0; transform: translate(-50%, 8px); } to { opacity: 1; transform: translate(-50%, 0); } }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <a href="#" class="brand" onclick="goScreen(1); return false;">
      <div class="brand-mark">C</div>
      <div class="brand-name">Check<span>itz</span></div>
    </a>
    <div class="header-actions">
      <button class="icon-btn" onclick="toggleTheme()" title="Toggle Light/Dark Theme">🌓</button>
      <button class="icon-btn" onclick="openCustomModal()" title="Audit Any Custom PG">➕</button>
    </div>
  </div>
</header>

<main id="app"></main>

<!-- Sticky Bottom Navigation -->
<nav class="tab-bar">
  <div class="tab-bar-inner" id="tabBar"></div>
</nav>

<!-- Toast Notice -->
<div id="toast"></div>

<!-- Custom PG Modal -->
<div class="modal-overlay" id="customModal">
  <div class="modal-box">
    <div class="modal-head">
      <h3 class="serif">Audit Any Custom PG</h3>
      <button class="modal-close" onclick="closeCustomModal()">✕</button>
    </div>
    <p class="hero-sub" style="margin-bottom:16px;">Visiting a place not in the VIT-AP list? Audit any hostel or apartment anywhere.</p>
    
    <div class="form-group">
      <label>PG / Hostel Name</label>
      <div class="inp-wrap"><input type="text" id="custName" placeholder="e.g. Sri Sai Luxury PG"></div>
    </div>
    <div class="form-group">
      <label>Area / Locality</label>
      <div class="inp-wrap"><input type="text" id="custLoc" placeholder="e.g. Mandadam / Vijayawada"></div>
    </div>
    <div class="form-group">
      <label>Advertised Starting Rent (optional)</label>
      <div class="inp-wrap"><span class="pre">₹</span><input type="number" id="custRent" placeholder="e.g. 8500"></div>
    </div>
    <button class="btn" style="margin-top:10px;" onclick="createCustomPG()">Start Custom Audit</button>
  </div>
</div>

<!-- Image Lightbox Modal -->
<div class="modal-overlay" id="imgModal" onclick="closeImgModal()">
  <div style="max-width:90vw;max-height:90vh;position:relative;">
    <img id="lightboxImg" src="" style="max-width:100%;max-height:85vh;border-radius:12px;box-shadow:0 10px 40px rgba(0,0,0,0.9);display:block;margin:auto;">
  </div>
</div>

<script>
// --- DATABASE & STATE ---
const DB_NAME = "checkitz_luxury_v1";
let db;

function initDB() {
  return new Promise((res, rej) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = e => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains("audits")) {
        d.createObjectStore("audits", { keyPath: "id" });
      }
    };
    req.onsuccess = e => { db = e.target.result; res(db); };
    req.onerror = e => rej(e);
  });
}

function saveAuditDB(audit) {
  return new Promise((res, rej) => {
    const tx = db.transaction("audits", "readwrite");
    tx.objectStore("audits").put(audit);
    tx.oncomplete = () => res();
    tx.onerror = e => rej(e);
  });
}

function getAllAuditsDB() {
  return new Promise((res, rej) => {
    const tx = db.transaction("audits", "readonly");
    const req = tx.objectStore("audits").getAll();
    req.onsuccess = () => res(req.result || []);
    req.onerror = e => rej(e);
  });
}

function deleteAuditDB(id) {
  return new Promise((res, rej) => {
    const tx = db.transaction("audits", "readwrite");
    tx.objectStore("audits").delete(id);
    tx.oncomplete = () => res();
    tx.onerror = e => rej(e);
  });
}

// Calculations
function calculateMetrics() {
  const activeChecks = S.quickMode ? AUDIT_CHECKS.filter(c => c.vital) : AUDIT_CHECKS;
  const answered = [];
  let scorePoints = 0;
  let maxPoints = 0;
  let counts = { g: 0, a: 0, p: 0 };
  
  activeChecks.forEach((c, idx) => {
    const val = S.ans[idx];
    if (val) {
      answered.push(c);
      counts[val]++;
      if (val === 'g') scorePoints += 10;
      else if (val === 'a') scorePoints += 5;
      maxPoints += 10;
    }
  });
  
  const score = maxPoints > 0 ? (scorePoints / maxPoints) * 10 : null;
  
  // Cost computation
  const rent = parseFloat(S.cost.rent) || 0;
  const food = parseFloat(S.cost.food) || 0;
  const elec = parseFloat(S.cost.elec) || 0;
  const other = parseFloat(S.cost.other) || 0;
  const dep = parseFloat(S.cost.dep) || 0;
  
  const totalMonthly = rent + food + elec + other;
  const shareFactor = S.sharing || 1;
  const myMonthly = totalMonthly / shareFactor;
  const myDeposit = dep / shareFactor;
  const myUpfront = myDeposit + myMonthly;
  
  return {
    score,
    scorePoints,
    maxPoints,
    answeredCount: answered.length,
    totalChecks: activeChecks.length,
    counts,
    totalMonthly,
    myMonthly,
    dep,
    myDeposit,
    myUpfront,
    shareFactor
  };
}

function handlePhotoUpload(el) {
  const files = Array.from(el.files).filter(f => f.type.startsWith("image/"));
  const remainingSlots = 3 - S.photos.length;
  if (remainingSlots <= 0) { toast("Maximum 3 photos allowed."); return; }
  
  files.slice(0, remainingSlots).forEach(file => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement("canvas");
        const maxDim = 900;
        let w = img.width;
        let h = img.height;
        if (w > maxDim || h > maxDim) {
          if (w > h) { h = Math.round(h * (maxDim / w)); w = maxDim; }
          else { w = Math.round(w * (maxDim / h)); h = maxDim; }
        }
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, w, h);
        const compressed = canvas.toDataURL("image/jpeg", 0.75);
        if (S.photos.length < 3) {
          S.photos.push(compressed);
          render();
        }
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
  el.value = "";
}

function removePhoto(idx) {
  S.photos.splice(idx, 1);
  render();
}

// WhatsApp Share Formatter
function shareWhatsApp() {
  const m = calculateMetrics();
  const promises = S.pg.promises || [];
  const mismatches = [];
  promises.forEach((p, idx) => { if (S.prom[idx] === 'x') mismatches.push(p); });

  let text = `🏠 *Checkitz Reality Card: ${S.pg.name}*\n`;
  text += `📍 *Area:* ${S.pg.loc}\n`;
  text += `⭐ *Audit Score:* ${m.score !== null ? m.score.toFixed(1) + "/10" : "Unscored"} (${m.answeredCount} items verified)\n\n`;
  
  text += `💰 *Financial Breakdown (${S.sharing}-Sharing):*\n`;
  text += `• Real Monthly Cost: ₹${Math.round(m.myMonthly).toLocaleString('en-IN')}/month\n`;
  text += `• Upfront Deposit: ₹${Math.round(m.myDeposit).toLocaleString('en-IN')}\n`;
  text += `• Total Initial Payment: ₹${Math.round(m.myUpfront).toLocaleString('en-IN')}\n\n`;

  if (mismatches.length > 0 || S.traps.commercialElec || S.traps.depositDeduction || S.traps.strictCurfew) {
    text += `⚠️ *Red Flags & Mismatches Detected:*\n`;
    if (S.traps.commercialElec) text += `• High electricity rate (>₹10/unit)\n`;
    if (S.traps.depositDeduction) text += `• Non-refundable deposit deduction\n`;
    if (S.traps.strictCurfew) text += `• Strict early curfew\n`;
    mismatches.forEach(mm => { text += `• Broken promise: ${mm}\n`; });
    text += `\n`;
  } else {
    text += `✅ *Clean Audit:* No critical mismatches found.\n\n`;
  }

  text += `Audited on Checkitz: https://praveens-arp.github.io/Checkitz/`;

  const url = `https://api.whatsapp.com/send?text=${encodeURIComponent(text)}`;
  window.open(url, '_blank');
  toast("WhatsApp summary created!");
}

// jsPDF Export

  toast("Generating PDF report...");
  const doc = new jsPDF({ unit: "mm", format: "a4" });
  const m = calculateMetrics();
  
  // Luxury Dark Editorial Palette for PDF
  doc.setFillColor(11, 15, 23);
  doc.rect(0, 0, 210, 32, "F");
  
  doc.setFont("helvetica", "bold");
  doc.setFontSize(22);
  doc.setTextColor(212, 163, 115);
  doc.text("Checkitz", 16, 20);
  
  doc.setFontSize(10);
  doc.setTextColor(255, 255, 255);
  doc.text("PG Reality Card & Audit Report", 194, 20, { align: "right" });
  
  let y = 44;
  doc.setTextColor(20, 20, 20);
  doc.setFontSize(16);
  doc.text(S.pg.name, 16, y);
  y += 6;
  doc.setFontSize(10);
  doc.setTextColor(100, 100, 100);
  doc.text(`Location: ${S.pg.loc}  |  Audit Date: ${new Date(S.date).toLocaleDateString()}`, 16, y);
  
  y += 12;
  doc.setDrawColor(220, 220, 220);
  doc.line(16, y, 194, y);
  y += 10;
  
  // Score Box
  doc.setFontSize(12);
  doc.setFont("helvetica", "bold");
  doc.setTextColor(20, 20, 20);
  doc.text("Inspection Score:", 16, y);
  doc.setTextColor(m.score >= 7.5 ? 46 : m.score >= 5 ? 224 : 220, m.score >= 7.5 ? 204 : m.score >= 5 ? 160 : 50, 50);
  doc.text(`${m.score !== null ? m.score.toFixed(1) + " / 10" : "Unscored"} (${m.answeredCount} checked)`, 60, y);
  
  y += 10;
  doc.setTextColor(20, 20, 20);
  doc.text("Financial Breakdown:", 16, y);
  y += 6;
  doc.setFont("helvetica", "normal");
  doc.setFontSize(10);
  doc.text(`Occupancy: ${S.sharing}-Sharing`, 20, y); y += 5;
  doc.text(`Real Monthly Cost per person: Rs. ${Math.round(m.myMonthly).toLocaleString('en-IN')}`, 20, y); y += 5;
  doc.text(`Security Deposit per person: Rs. ${Math.round(m.myDeposit).toLocaleString('en-IN')}`, 20, y); y += 5;
  doc.setFont("helvetica", "bold");
  doc.text(`Initial Outflow Required: Rs. ${Math.round(m.myUpfront).toLocaleString('en-IN')}`, 20, y);
  
  y += 12;
  doc.line(16, y, 194, y);
  y += 10;
  
  // Checks List
  doc.setFont("helvetica", "bold");
  doc.setFontSize(12);
  doc.text("Inspection Parameters Evaluated:", 16, y);
  y += 6;
  doc.setFont("helvetica", "normal");
  doc.setFontSize(9);
  
  const checks = S.quickMode ? AUDIT_CHECKS.filter(c => c.vital) : AUDIT_CHECKS;
  checks.forEach((c, idx) => {
    const val = S.ans[idx];
    const label = val === 'g' ? "Good [10 pts]" : val === 'a' ? "Average [5 pts]" : val === 'p' ? "Poor [0 pts]" : "Not Checked";
    doc.text(`• ${c.name}: ${label}`, 20, y);
    y += 5;
  });
  
  // Evidence photos if any
  if (S.photos.length > 0) {
    y += 6;
    doc.setFont("helvetica", "bold");
    doc.setFontSize(11);
    doc.text("Attached Photographic Evidence:", 16, y);
    y += 8;
    S.photos.forEach((ph, i) => {
      if (y < 230) {
        doc.addImage(ph, "JPEG", 16 + (i * 60), y, 52, 40);
      }
    });
    y += 45;
  }
  
  // Footer
  doc.setFontSize(8);
  doc.setTextColor(130, 130, 130);
  doc.text("Generated by Checkitz — Student PG Audit & Reality Intelligence Platform.", 16, 285);
  
  doc.save(`${S.pg.name.replace(/[^a-zA-Z0-9]/g, "_")}_RealityCard.pdf`);
  toast("PDF Downloaded successfully!");
}

    selectedForCompare.push(id);
  }
  render();
}

async function reopenAudit(id) {
  const audit = savedAuditsList.find(a => a.id === id);
  if (!audit) return;
  S = { ...audit };
  goScreen(5);
}

async function editAudit(id) {
  const audit = savedAuditsList.find(a => a.id === id);
  if (!audit) return;
  S = { ...audit };
  goScreen(2);
}

async function deleteAuditItem(id) {
  if (confirm("Delete this saved audit?")) {
    await deleteAuditDB(id);
    selectedForCompare = selectedForCompare.filter(x => x !== id);
    render();
    toast("Audit deleted.");
  }
}

// Render Engine
async function render() {
  const app = document.getElementById("app");
  
  if (S.screen === 1) app.innerHTML = renderScreen1();
  else if (S.screen === 2) app.innerHTML = renderScreen2();
  else if (S.screen === 3) app.innerHTML = renderScreen3();
  else if (S.screen === 4) app.innerHTML = renderScreen4();
  else if (S.screen === 5) app.innerHTML = renderScreen5();
  else if (S.screen === 6) app.innerHTML = await renderScreen6();

  // Tab Bar
  const tabs = [
    { num: 1, label: "Explore" },
    { num: 2, label: "Audit" },
    { num: 3, label: "Costs" },
    { num: 4, label: "Reality" },
    { num: 5, label: "Report" },
    { num: 6, label: "Saved" }
  ];

  document.getElementById("tabBar").innerHTML = tabs.map(t => `
    <button class="tab-btn ${S.screen === t.num ? 'active' : ''}" onclick="goScreen(${t.num})">
      <span class="num">${t.num}</span>
      ${t.label}
    </button>
  `).join("");
}
